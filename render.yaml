# Render Blueprint: New + -> Blueprint -> select this repo, Render reads this file.
# DATABASE_URL is left unset here (sync: false) so it's entered as a secret in
# the Render dashboard instead of committed to git.
services:
  - type: web
    name: reporank
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: INDEX_PATH
        value: /app/index_snapshot.pkl
      - key: INDEX_SNAPSHOT_URL
        # Trimmed to the top 50k repos by stars: Render's free-tier 512MB cap
        # can't hold the full 157k index (measured ~605MB resident vs ~256MB
        # for this subset). Rebuild with: python -m app.cli build-index --limit 50000
        value: https://github.com/chengjcrystal/reporank/releases/download/index-snapshot-prod-v1/index_snapshot.prod.pkl
      - key: DATABASE_URL
        sync: false
