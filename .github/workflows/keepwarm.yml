name: keepwarm

# Render's free tier spins the service down after 15 min without traffic.
# A ping every 5 min keeps the demo awake so the first visitor doesn't wait.
# One always-on free service uses ~744 of the 750 free hours a month.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://reporank-jgoo.onrender.com/healthz
